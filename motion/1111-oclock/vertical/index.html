    <script>
      (function () {
        const SVGNS = "http://www.w3.org/2000/svg";
        const $ = (s) => document.querySelector(s);
        const $$ = (s) => Array.from(document.querySelectorAll(s));
        const el = (tag, cls, parent, text) => {
          const n = document.createElement(tag);
          if (cls) n.className = cls;
          if (text != null) n.textContent = text;
          if (parent) parent.appendChild(n);
          return n;
        };
        const sv = (tag, attrs, parent) => {
          const n = document.createElementNS(SVGNS, tag);
          for (const k in attrs) n.setAttribute(k, attrs[k]);
          if (parent) parent.appendChild(n);
          return n;
        };
        // Seeded PRNG: every "random" placement is reproducible frame to frame.
        let seed = 1111;
        const rnd = () => {
          seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };

        const tl = gsap.timeline({ paused: true });
        const GOLD = "#f2b33d", INK = "#0b0b0e", CREAM = "#f3ede2";

        /* ================= HUD ================= */
        const labs = ["#lab1", "#lab2", "#lab3", "#lab4", "#lab5"];
        const labT = [0, 3.0, 6.0, 9.45, 11.0];
        labs.forEach((id, i) => {
          tl.set(id, { opacity: 1 }, labT[i] || 0.001);
          if (i > 0) tl.set(labs[i - 1], { opacity: 0 }, labT[i]);
        });
        tl.set("#lab1", { opacity: 1 }, 0);
        // Timecode built from stepped digit strips (pure transforms, seek-safe).
        const tc = $("#tc");
        const mkDigit = (n) => {
          const d = el("div", "tcd", tc);
          const s = el("div", "tcs", d);
          for (let i = 0; i <= n; i++) el("i", "", s, String(i % (n === 10 ? 10 : n)));
          return s;
        };
        const sep = () => el("span", "tsep", tc, ":");
        el("span", "", tc, "00"); sep();
        const sT = mkDigit(10), sU = mkDigit(10); sep();
        const fT = mkDigit(10), fU = mkDigit(10);
        // GSAP steps(n) yields n+1 levels across the tween, so n-1 steps over (n-1) rows shows n digits.
        tl.to(fU, { y: -198, ease: "steps(9)", duration: 1 / 3, repeat: 44 }, 0);
        tl.to(fT, { y: -44, ease: "steps(2)", duration: 1, repeat: 14 }, 0);
        tl.to(sU, { y: -198, ease: "steps(9)", duration: 10 }, 0);
        tl.fromTo(sU, { y: 0 }, { y: -88, ease: "steps(4)", duration: 5, immediateRender: false }, 10);
        tl.set(sT, { y: -22 }, 10);
        tl.to("#rec", { opacity: 0.15, duration: 0.5, ease: "steps(1)", yoyo: true, repeat: 29 }, 0);
        // Film grain jitter
        for (let i = 0; i < 120; i++) {
          tl.set("#grain", { x: Math.round((rnd() - 0.5) * 300), y: Math.round((rnd() - 0.5) * 300) }, i / 8);
        }

        /* ================= 01 · FLIP ================= */
        const makeHalf = (pos, digit, extra) => {
          const h = el("div", "half " + pos + (extra ? " " + extra : ""));
          el("div", "g", h, digit);
          if (extra) el("div", "shade", h);
          return h;
        };
        function buildCard(cardSel, start, flips) {
          const host = $(cardSel + " .card-in");
          const s0 = el("div", "set first", host);
          s0.appendChild(makeHalf("top", start));
          s0.appendChild(makeHalf("bot", start));
          let prev = start, prevSet = s0;
          flips.forEach(([to, t, dur]) => {
            const s = el("div", "set", host);
            s.appendChild(makeHalf("top", to));
            s.appendChild(makeHalf("bot", prev));
            const fT = makeHalf("top", prev, "flapT");
            const fB = makeHalf("bot", to, "flapB");
            s.appendChild(fT); s.appendChild(fB);
            tl.set(s, { opacity: 1 }, t);
            tl.set(prevSet, { opacity: 0 }, t);
            tl.fromTo(fT, { rotationX: 0 }, { rotationX: -90, duration: dur / 2, ease: "power2.in" }, t);
            tl.fromTo(fT.querySelector(".shade"), { opacity: 0 }, { opacity: 0.7, duration: dur / 2, ease: "power2.in" }, t);
            tl.fromTo(fB, { rotationX: 90 }, { rotationX: 0, duration: dur / 2, ease: "back.out(2.2)" }, t + dur / 2);
            tl.fromTo(fB.querySelector(".shade"), { opacity: 0.55 }, { opacity: 0, duration: dur / 2, ease: "power1.out" }, t + dur / 2);
            prev = to; prevSet = s;
          });
        }
        const FAST = 0.1;
        buildCard("#cH1", "1", []);
        buildCard("#cH2", "1", []);
        buildCard("#cM1", "0", [["1", 1.55, 0.3]]);
        buildCard("#cM2", "2", [
          ["3", 0.42, FAST], ["4", 0.53, FAST], ["5", 0.64, FAST], ["6", 0.75, FAST], ["7", 0.86, FAST], ["8", 0.97, FAST],
          ["9", 1.18, 0.26], ["0", 1.55, 0.3], ["1", 2.0, 0.32],
        ]);
        // Cards drop in
        tl.fromTo("#flipRow > *", { y: -90, opacity: 0, rotationX: 70, transformPerspective: 1400 },
          { y: 0, opacity: 1, rotationX: 0, duration: 0.55, ease: "expo.out", stagger: 0.06 }, 0.0);
        // Slow camera drift in 3D
        tl.fromTo("#s1cam", { scale: 0.86, rotationY: -16, rotationX: 9, transformPerspective: 2200 },
          { scale: 1.0, rotationY: 5, rotationX: -2, duration: 2.32, ease: "power1.inOut" }, 0);
        tl.fromTo("#s1barFill", { scaleX: 0 }, { scaleX: 1, duration: 2.0, ease: "power2.in" }, 0.32);
        tl.fromTo("#s1meta", { opacity: 0, y: 14 }, { opacity: 0.7, y: 0, duration: 0.6, ease: "power2.out" }, 0.45);
        tl.to("#s1colon .dot", { opacity: 0.25, duration: 0.06, yoyo: true, repeat: 1, stagger: 0 }, 1.0);
        tl.to("#s1colon .dot", { opacity: 0.25, duration: 0.06, yoyo: true, repeat: 1 }, 1.5);
        // 11:11 lands — the whole row turns gold
        tl.to("#flipRow", { "--card": GOLD, "--glyph": INK, duration: 0.12, ease: "none" }, 2.32);
        tl.to("#s1colon .dot", { backgroundColor: INK, duration: 0.12 }, 2.32);
        tl.fromTo("#flipRow", { scale: 1 }, { scale: 1.07, duration: 0.09, ease: "power2.out", yoyo: true, repeat: 1 }, 2.32);
        tl.to("#s1cam", { scale: 1.05, rotationY: 0, rotationX: 0, duration: 0.35, ease: "expo.out" }, 2.32);
        tl.to("#s1metaR", { color: GOLD, duration: 0.1 }, 2.32);

        // Gold circle wipe out of the colon
        tl.fromTo("#wipeGold", { scale: 0 }, { scale: 1, duration: 0.4, ease: "power3.in" }, 2.6);

        /* ================= 02 · CLOCK ================= */
        tl.fromTo("#s2stage", { clipPath: "circle(0px at 50% 50%)" }, { clipPath: "circle(1150px at 50% 50%)", duration: 0.45, ease: "power3.out" }, 2.98);
        const ticks = $("#ticks");
        const tickEls = [];
        for (let i = 0; i < 60; i++) {
          const major = i % 5 === 0;
          const g = sv("g", { transform: `rotate(${i * 6})` }, ticks);
          const ln = sv("line", { x1: 0, x2: 0, y1: -392, y2: major ? -350 : -374, stroke: major ? GOLD : "rgba(243,237,226,0.6)", "stroke-width": major ? 5 : 2, "stroke-linecap": "round" }, g);
          tickEls.push(ln);
        }
        const nums = $("#nums");
        const numEls = [];
        for (let h = 1; h <= 12; h++) {
          const a = (h * 30 - 90) * Math.PI / 180;
          const t = sv("text", { x: (Math.cos(a) * 300).toFixed(1), y: (Math.sin(a) * 300 + 10).toFixed(1), "text-anchor": "middle", class: "hourNum" }, nums);
          t.textContent = String(h).padStart(2, "0");
          if (h === 11) t.setAttribute("id", "num11");
          numEls.push(t);
        }
        $("#circTP").textContent = "MASTERCLASS ✦ O'CLOCK ✦ ".repeat(6);
        const C = 2 * Math.PI * 400;
        tl.fromTo("#ringOuter", { attr: { "stroke-dasharray": C, "stroke-dashoffset": C } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.75, ease: "power2.inOut" }, 3.05);
        tl.fromTo("#ringInner", { scale: 0.6, opacity: 0, svgOrigin: "0 0" }, { scale: 1, opacity: 1, duration: 0.8, ease: "expo.out" }, 3.15);
        tl.fromTo(tickEls, { scale: 0, svgOrigin: "0 -392" }, { scale: 1, duration: 0.3, ease: "back.out(3)", stagger: 0.009 }, 3.12);
        tl.fromTo(numEls, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)", stagger: 0.035 }, 3.3);
        tl.fromTo("#circGroup", { rotation: -40, opacity: 0, svgOrigin: "0 0" }, { rotation: 50, opacity: 1, duration: 3.0, ease: "power2.out" }, 3.0);
        tl.fromTo(".s2side", { opacity: 0, y: 20 }, { opacity: 0.75, y: 0, duration: 0.5, ease: "power2.out", stagger: 0.1 }, 3.45);
        // Hands: spin from 12:00 to 11:11:11, ghosts trail behind as a motion blur
        const SPIN0 = 3.3, SPIN = 1.7;
        tl.fromTo("#hourHand", { rotation: 0, svgOrigin: "0 0" }, { rotation: 360 + 335.5, duration: SPIN, ease: "expo.inOut" }, SPIN0);
        tl.fromTo("#minHand", { rotation: 0, svgOrigin: "0 0" }, { rotation: 360 * 11 + 66, duration: SPIN, ease: "expo.inOut" }, SPIN0);
        $$("#hands .ghost").forEach((g, i) => {
          tl.fromTo(g, { rotation: 0, svgOrigin: "0 0" }, { rotation: 360 * 11 + 66, duration: SPIN, ease: "expo.inOut" }, SPIN0 + (3 - i) * 0.035);
        });
        tl.fromTo("#secHand", { rotation: 0, svgOrigin: "0 0" }, { rotation: 360 * 4 + 66, duration: SPIN + 0.08, ease: "expo.inOut" }, SPIN0);
        tl.fromTo("#hands", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 3.2);
        // Landing hit at 5.0
        tl.fromTo("#shock2", { scale: 1, opacity: 0.9, svgOrigin: "0 0" }, { immediateRender: false, scale: 1.45, opacity: 0, duration: 0.7, ease: "power2.out" }, 5.0);
        tl.to("#num11", { fill: GOLD, scale: 1.6, transformOrigin: "50% 50%", duration: 0.25, ease: "back.out(3)" }, 5.0);
        tl.fromTo("#clockAll", { rotation: 0, svgOrigin: "0 0" }, { rotation: 3, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.out" }, 5.0);
        tl.to("#s2R", { color: GOLD, duration: 0.1 }, 5.0);
        // Dive into the gold cap
        tl.to("#clockAll", { scale: 5, opacity: 0, svgOrigin: "0 0", duration: 0.5, ease: "power3.in" }, 5.5);
        tl.to(".s2side", { opacity: 0, duration: 0.2 }, 5.5);
        tl.to("#capIn", { scale: 0, svgOrigin: "0 0", duration: 0.2 }, 5.5);
        tl.to("#cap", { scale: 70, svgOrigin: "0 0", duration: 0.5, ease: "power3.in" }, 5.5);

        /* ================= 03 · TYPE ================= */
        const hits = [["#h1", 6.0], ["#h2", 6.4], ["#h3", 6.8], ["#h4", 7.2], ["#h5", 7.8]];
        hits.forEach(([id, t], i) => {
          tl.set(id, { opacity: 1 }, t);
          if (i > 0) tl.set(hits[i - 1][0], { opacity: 0 }, t);
        });
        tl.fromTo("#h1 .hitWord", { scale: 1.6, rotation: -6 }, { scale: 1, rotation: 0, duration: 0.38, ease: "expo.out" }, 6.0);
        tl.fromTo("#h2 .hitWord", { xPercent: 22, skewX: -18 }, { xPercent: 0, skewX: 0, duration: 0.38, ease: "expo.out" }, 6.4);
        tl.fromTo("#h3 .fillw", { xPercent: -22, opacity: 1 }, { xPercent: 0, duration: 0.38, ease: "expo.out" }, 6.8);
        tl.fromTo("#h3 .outline", { xPercent: -22, y: 0 }, { xPercent: 4, y: 26, duration: 0.38, ease: "expo.out" }, 6.8);
        tl.fromTo("#h4 .hitWord", { clipPath: "inset(0% 100% 0% 0%)", rotation: -10, scale: 1.12 }, { clipPath: "inset(0% 0% 0% 0%)", rotation: -4, scale: 1, duration: 0.5, ease: "power3.out" }, 7.2);
        tl.to("#h4 .hitWord", { scale: 1.06, duration: 0.6, ease: "none" }, 7.7);

        // Marquee rows
        const rows = $("#rows");
        const rowDefs = [
          { cls: "outline", word: "11:11", dir: 1 },
          { cls: "fill", word: "AGENTS", dir: -1 },
          { cls: "outline", word: "CASTING DIRECTORS", dir: 1 },
          { cls: "fill", word: "11:11", dir: -1 },
          { cls: "gold", word: "MASTERCLASS", dir: 1 },
          { cls: "fill", word: "FILM DIRECTORS", dir: -1 },
          { cls: "outline", word: "11:11", dir: 1 },
          { cls: "gold", word: "AGENTS", dir: -1 },
          { cls: "outline", word: "CASTING DIRECTORS", dir: 1 },
        ];
        const rowEls = rowDefs.map((d) => {
          const r = el("div", "row " + d.cls, rows);
          for (let i = 0; i < 8; i++) { el("span", "t", r, d.word); el("span", "star4", r); }
          return r;
        });
        tl.set("#rows", { rotation: -8 }, 0);
        rowEls.forEach((r, i) => {
          const d = rowDefs[i].dir;
          tl.fromTo(r, { x: -900 + d * 1400 }, { x: -900 + d * 300, duration: 0.45, ease: "expo.out" }, 7.8 + i * 0.04);
          tl.to(r, { x: -900 + d * -150, duration: 1.0, ease: "none" }, 8.25 + i * 0.04);
        });
        tl.to("#rows", { scaleY: 0, duration: 0.28, ease: "power3.in" }, 9.05);
        tl.fromTo("#goldLine", { rotation: -8, scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "expo.out" }, 9.22);
        tl.to("#goldLine", { scaleX: 0, transformOrigin: "100% 50%", duration: 0.2, ease: "power3.in" }, 9.47);

        /* ================= 04 · WISH ================= */
        const stars = $("#stars");
        for (let i = 0; i < 150; i++) {
          const s = el("div", "starDot", stars);
          const sz = 1.5 + rnd() * 3;
          s.style.width = s.style.height = sz.toFixed(1) + "px";
          s.style.left = (rnd() * 1080).toFixed(0) + "px";
          s.style.top = (rnd() * 1920).toFixed(0) + "px";
          const t0 = 9.45 + rnd() * 0.4;
          const peak = 0.35 + rnd() * 0.6;
          tl.fromTo(s, { opacity: 0 }, { opacity: peak, duration: 0.3, ease: "power1.out" }, t0);
          tl.to(s, { opacity: peak * 0.25, duration: 0.25 + rnd() * 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, t0 + 0.3 + rnd() * 0.5);
        }
        const wishEl = $("#wishText");
        const wishChars = [];
        ["learn from", "the best."].forEach((line) => {
          const ln = el("div", "", wishEl);
          ln.style.display = "flex"; ln.style.whiteSpace = "pre";
          Array.from(line).forEach((ch) => wishChars.push(el("span", "", ln, ch)));
        });
        tl.fromTo(wishChars, { opacity: 0, y: 40, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out", stagger: 0.035 }, 9.55);
        tl.to(wishChars, { opacity: 0, y: -50, filter: "blur(10px)", duration: 0.35, ease: "power2.in", stagger: 0.025 }, 10.5);
        // Shooting star: straight line from top-left into frame centre, accelerating.
        const SX = -260, SY = 380, EX = 540, EY = 960, L0 = 10.25, LD = 0.75;
        const ang = Math.atan2(EY - SY, EX - SX) * 180 / Math.PI;
        tl.set("#shootRot", { rotation: ang }, 0);
        tl.fromTo("#shoot", { x: SX, y: SY }, { x: EX, y: EY, duration: LD, ease: "power2.in" }, L0);
        tl.fromTo("#shootTrail", { scaleX: 0.2 }, { scaleX: 1.4, duration: LD, ease: "power2.in" }, L0);
        const sparks = $("#sparks");
        for (let i = 0; i < 26; i++) {
          const p = 0.15 + 0.85 * (i / 26);
          const s = el("div", "spark", sparks);
          s.style.left = (SX + (EX - SX) * p).toFixed(0) + "px";
          s.style.top = (SY + (EY - SY) * p).toFixed(0) + "px";
          const t = L0 + LD * Math.sqrt(p);
          tl.fromTo(s, { opacity: 1, scale: 0.6 + rnd() }, { immediateRender: false, opacity: 0, x: (rnd() - 0.5) * 60, y: 30 + rnd() * 70, scale: 0, duration: 0.5 + rnd() * 0.3, ease: "power2.out" }, t);
        }

        /* ================= 05 · LOCKUP ================= */
        const buildTime = (host, cls) => {
          const parts = [];
          ["1", "1", ":", "1", "1"].forEach((c) => {
            if (c === ":") {
              const col = el("div", "bcolon", host);
              parts.push(el("div", "bdot a", col), el("div", "bdot b", col));
            } else {
              const m = el("span", "mask", host);
              parts.push(el("span", "", m, c));
            }
          });
          return parts;
        };
        const timeParts = buildTime($("#bigTime"));
        buildTime($("#shine"));
        const digitSpans = timeParts.filter((p) => p.tagName === "SPAN");
        const dotEls = timeParts.filter((p) => p.tagName === "DIV");
        const mcChars = Array.from("MASTERCLASS").map((c) => el("span", "", $("#mc"), c));
        const motto = $("#motto");
        const ruleL = el("div", "rule", motto);
        const mottoWrap = el("div", "", motto); mottoWrap.style.display = "flex";
        const mottoChars = Array.from("QUALITY OVER QUANTITY").map((c) => el("span", "", mottoWrap, c));
        const ruleR = el("div", "rule", motto);
        tl.fromTo(mottoChars, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out", stagger: 0.018 }, 12.15);
        tl.fromTo([ruleL, ruleR], { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, 12.2);
        const urlChars = Array.from("1111MASTERCLASS.COM").map((c) => el("span", "", $("#url"), c));
        el("div", "", $("#url")).id = "cursor";
        const lt = $("#lockTicks");
        const lockTickEls = [];
        for (let i = 0; i < 44; i++) {
          const g = sv("g", { transform: `rotate(${i * (360 / 44)})` }, lt);
          lockTickEls.push(sv("line", { x1: 0, x2: 0, y1: -488, y2: i % 11 === 0 ? -510 : -496, stroke: i % 11 === 0 ? GOLD : "rgba(243,237,226,0.45)", "stroke-width": i % 11 === 0 ? 4 : 2, "stroke-linecap": "round" }, g));
        }
        const burst = $("#burst");
        for (let i = 0; i < 40; i++) {
          const b = el("div", "bspark", burst);
          const a = rnd() * Math.PI * 2, dist = 260 + rnd() * 620;
          const sc = 0.5 + rnd() * 1.4;
          tl.fromTo(b, { x: 0, y: 0, opacity: 1, scale: sc, backgroundColor: i % 3 ? GOLD : CREAM },
            { immediateRender: false, x: Math.cos(a) * dist, y: Math.sin(a) * dist, opacity: 0, scale: 0, duration: 0.8 + rnd() * 0.5, ease: "expo.out" }, 11.0);
        }
        tl.fromTo("#flash", { opacity: 0.85 }, { immediateRender: false, opacity: 0, duration: 0.35, ease: "power2.out" }, 11.0);
        tl.fromTo("#shock", { scale: 0.05, opacity: 1 }, { immediateRender: false, scale: 1.5, opacity: 0, duration: 0.9, ease: "expo.out" }, 11.0);
        tl.fromTo(digitSpans, { yPercent: 110 }, { yPercent: 0, duration: 0.75, ease: "expo.out", stagger: 0.06 }, 11.02);
        tl.fromTo(dotEls, { scale: 0 }, { scale: 1, duration: 0.5, ease: "back.out(3)", stagger: 0.06 }, 11.12);
        tl.fromTo("#lockInner", { scale: 1.12 }, { scale: 1, duration: 1.2, ease: "expo.out" }, 11.0);
        const RC = 2 * Math.PI * 470;
        tl.fromTo("#lockRing", { attr: { "stroke-dasharray": RC, "stroke-dashoffset": RC } }, { attr: { "stroke-dashoffset": 0 }, duration: 1.1, ease: "power3.inOut" }, 11.25);
        tl.fromTo(lockTickEls, { opacity: 0, scale: 0, svgOrigin: "0 -488" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)", stagger: 0.012 }, 11.35);
        tl.fromTo("#ringRot", { rotation: -30, svgOrigin: "0 0" }, { rotation: 25, duration: 4.0, ease: "power2.out" }, 11.0);
        tl.fromTo(mcChars, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.55, ease: "expo.out", stagger: 0.035 }, 11.45);
        // Tracking spread done with per-glyph x so it interpolates sub-pixel
        mcChars.forEach((c, i) => tl.fromTo(c, { x: (i - 5) * 46 }, { x: 0, duration: 1.1, ease: "expo.out" }, 11.45));
        tl.fromTo("#oclock", { clipPath: "inset(-20% 100% -20% 0%)", rotation: -18, y: 30 }, { clipPath: "inset(-20% 0% -20% 0%)", rotation: -9, y: 0, duration: 0.75, ease: "power3.inOut" }, 11.9);
        tl.fromTo(urlChars, { opacity: 0 }, { opacity: 0.8, duration: 0.01, stagger: 0.03 }, 12.45);
        tl.fromTo("#cursor", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 12.4);
        tl.to("#cursor", { opacity: 0, duration: 0.25, ease: "steps(1)", yoyo: true, repeat: 9 }, 13.0);
        // Light sweep across 11:11
        tl.fromTo("#shine", { clipPath: "polygon(-30% 0%, -10% 0%, -30% 100%, -50% 100%)" },
          { clipPath: "polygon(130% 0%, 150% 0%, 130% 100%, 110% 100%)", duration: 0.85, ease: "power2.inOut" }, 12.9);
        tl.fromTo("#lock", { scale: 1 }, { scale: 1.035, duration: 2.6, ease: "sine.inOut" }, 12.4);

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
