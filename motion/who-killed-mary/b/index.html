        background: repeating-linear-gradient(0deg, rgba(255,255,255,0) 0 6px, rgba(255,255,255,0.35) 6px 8px, rgba(255,255,255,0) 8px 17px), linear-gradient(180deg, rgba(255,255,255,0), rgba(220,230,255,0.28) 50%, rgba(255,255,255,0)); }
      #scan { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 2px, rgba(0,0,0,0) 2px 4px); }

        <div id="static"><svg id="staticSvg" viewBox="0 0 1080 1920" preserveAspectRatio="none"><filter id="snow" x="0" y="0" width="1" height="1"><feTurbulence id="snowTurb" type="fractalNoise" baseFrequency="1.4" numOctaves="1" seed="21" /><feColorMatrix type="saturate" values="0" /><feComponentTransfer><feFuncR type="linear" slope="1.8" intercept="-0.3" /><feFuncG type="linear" slope="1.8" intercept="-0.3" /><feFuncB type="linear" slope="1.8" intercept="-0.3" /></feComponentTransfer></filter><rect width="1080" height="1920" filter="url(#snow)" /></svg></div>

    <script>
      (function () {
        const $ = (s) => document.querySelector(s);
        const el = (tag, cls, parent, text) => {
          const n = document.createElement(tag);
          if (cls) n.className = cls;
          if (text != null) n.textContent = text;
          if (parent) parent.appendChild(n);
          return n;
        };
        let seed = 1313;
        const rnd = () => {
          seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
        const tl = gsap.timeline({ paused: true });
        const STEP = 1 / 30;
        const T = (t) => +t.toFixed(4);
        // Glitch spikes: the audio score (build-audio-b.mjs) fires its glitch hits on these same times.
        const SPIKES = [1.45, 1.95, 2.55, 3.1, 3.6, 3.95, 4.25, 4.45, 10.9, 11.0, 11.15, 11.25, 11.5, 11.95, 12.4, 12.85, 13.3, 13.75, 14.6, 16.6, 17.2, 18.4];
        const env = (t, base) => Math.min(1, base + SPIKES.reduce((m, s) => (t >= s ? Math.max(m, Math.exp(-(t - s) / 0.13)) : m), 0));

        /* ---------- global tape artefacts ---------- */
        for (let i = 0; i < 160; i++) tl.set("#grain", { x: Math.round((rnd() - 0.5) * 300), y: Math.round((rnd() - 0.5) * 300) }, T(i / 8));
        const cnt = $("#osdCount");
        for (let s = 0; s < 20; s++) {
          const sp = el("span", "", cnt, "0:00:" + String(s).padStart(2, "0"));
          tl.set(sp, { opacity: 1 }, s);
          if (s < 19) tl.set(sp, { opacity: 0 }, s + 1);
        }
        tl.to("#osdPlay .tri", { opacity: 0, duration: 0.5, ease: "steps(1)", yoyo: true, repeat: 38 }, 0);
        const staticOn = (t0, t1, peak) => {
          // A fresh noise seed every frame: moving one big filtered plate gets clipped by Chrome.
          for (let t = t0; t < t1; t += STEP) {
            tl.set("#static", { opacity: peak * (0.7 + 0.3 * rnd()) }, T(t));
            tl.set("#snowTurb", { attr: { seed: Math.floor(rnd() * 9999) } }, T(t));
          }
          tl.set("#static", { opacity: 0 }, T(t1));
        };
        staticOn(0.95, 1.42, 1);
        staticOn(11.22, 11.42, 0.9);
        staticOn(14.5, 14.66, 1);
        [[1.4, 0.9], [4.4, 0.7], [10.85, 0.5], [16.55, 0.8]].forEach(([t, d]) => {
          tl.set("#track", { opacity: 1 }, t);
          tl.fromTo("#track", { y: -200 }, { y: 2000, duration: d, ease: "none", immediateRender: false }, t);
          tl.set("#track", { opacity: 0 }, T(t + d));
        });

        /* ---------- glitch rig ---------- */
        function makeRig(host, w, h, left, top) {
          const rig = el("div", "rig", host);
          Object.assign(rig.style, { width: w + "px", height: h + "px", left: left + "px", top: top + "px" });
          const chans = ["chR", "chG", "chB"].map((f) => { const c = el("div", "layer chan", rig); c.style.filter = `url(#${f})`; return c; });
          const slices = Array.from({ length: 7 }, () => el("div", "layer slice", rig));
          const drags = Array.from({ length: 3 }, () => el("div", "layer drag", rig));
          return { rig, chans, slices, drags, w, h };
        }
        function driveRig(R, t0, t1, base, amp) {
          for (let t = t0; t < t1; t += STEP) {
            const e = env(t, base), at = T(t);
            const dx = ((rnd() - 0.5) * 2 + 0.6) * amp * e;
            tl.set(R.chans[0], { x: dx, y: (rnd() - 0.5) * 8 * e }, at);
            tl.set(R.chans[2], { x: -dx * 0.9, y: (rnd() - 0.5) * 8 * e }, at);
            R.slices.forEach((s, i) => {
              if (i < Math.ceil(e * 7) && rnd() < e) {
                const top = rnd() * R.h, hh = 6 + rnd() * 150 * e;
                tl.set(s, { clipPath: `inset(${top.toFixed(0)}px 0px ${Math.max(0, R.h - top - hh).toFixed(0)}px 0px)`, x: Math.round((rnd() - 0.5) * 2 * 380 * e) }, at);
              } else tl.set(s, { clipPath: "inset(0px 0px 100% 0px)", x: 0 }, at);
            });
            R.drags.forEach((d) => {
              if (e > 0.5 && rnd() < 0.55) {
                const yb = rnd() * R.h * 0.75, x1 = rnd() * R.w * 0.8, x2 = Math.min(R.w, x1 + 40 + rnd() * 280);
                tl.set(d, { opacity: 1, transformOrigin: `50% ${yb.toFixed(0)}px`, scaleY: 45, clipPath: `inset(${yb.toFixed(0)}px ${(R.w - x2).toFixed(0)}px 0px ${x1.toFixed(0)}px)` }, at);
              } else tl.set(d, { opacity: 0 }, at);
            });
          }
          R.slices.forEach((s) => tl.set(s, { clipPath: "inset(0px 0px 100% 0px)", x: 0 }, T(t1)));
          R.drags.forEach((d) => tl.set(d, { opacity: 0 }, T(t1)));
        }

        /* ===== 01 · VHS boot ===== */
        tl.fromTo("#play", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.12);
        tl.to("#play", { opacity: 0, duration: 0.01 }, 0.55);
        tl.to("#play", { opacity: 1, duration: 0.01 }, 0.7);
        tl.fromTo("#play", { scaleY: 1, skewX: 0 }, { scaleY: 0.2, skewX: 40, duration: 0.25, ease: "power3.in" }, 0.85);

        /* ===== 02 · Torn cover ===== */
        const R2 = makeRig($("#rig2host"), 1080, 1715, 0, 102);
        driveRig(R2, 1.4, 4.6, 0.1, 60);
        tl.fromTo(R2.rig, { scale: 1.15 }, { scale: 1, duration: 3.2, ease: "power2.out" }, 1.4);
        [["#fw1", 1.95, 2.25, -6], ["#fw2", 2.55, 2.85, 4], ["#fw3", 3.1, 3.35, -3], ["#fw4", 3.6, 3.85, 7], ["#fw5", 3.95, 4.3, -4]].forEach(([id, a, b, r]) => {
          tl.set(id, { opacity: 1, rotation: r }, a);
          tl.fromTo(id, { scale: 1.35 }, { scale: 1, duration: b - a, ease: "expo.out", immediateRender: false }, a);
          for (let t = a; t < b; t += STEP) tl.set(id, { x: Math.round((rnd() - 0.5) * 60), skewX: Math.round((rnd() - 0.5) * 20) }, T(t));
          tl.set(id, { opacity: 0 }, b);
        });

        /* ===== 03 · Evidence montage ===== */
        const crops = {
          lily: [600, 100, 260], sequins: [690, 340, 200], prints: [700, 820, 222], who: [90, 250, 340],
          mary: [100, 900, 300], author: [100, 1020, 250], printsClose: [760, 900, 130], lilyClose: [680, 130, 150],
        };
        const labels = { lily: "EVIDENCE: LILY", sequins: "EVIDENCE: SEQUIN", prints: "EVIDENCE: PRINTS", printsClose: "EVIDENCE: PRINTS", lilyClose: "EVIDENCE: LILY", who: "SUSPECT: ???", mary: "VICTIM: MARY", author: "WITNESS: ???" };
        const shotsDef = [
          [4.6, "lily"], [4.88, "sequins"], [5.12, "prints"], [5.35, "black"], [5.42, "who"], [5.65, "mary"], [5.85, "lily", 1],
          [6.08, "printsClose"], [6.35, "sequins"], [6.6, "author"], [6.85, "who"], [7.05, "prints"], [7.25, "mary", 1],
          [7.5, "lilyClose"], [7.75, "prints"], [8.1, "black"],
        ];
        let prevShot = null;
        shotsDef.forEach(([t, key, inv], i) => {
          const s = el("div", "shot" + (key === "black" ? " black" : "") + (inv ? " inv" : ""), $("#shots"));
          $("#shots").insertBefore(s, $("#ttp"));
          if (key !== "black") {
            const [x, y, w] = crops[key], k = 1080 / w;
            s.style.backgroundSize = `${(922 * k).toFixed(1)}px ${(1464 * k).toFixed(1)}px`;
            s.style.backgroundPosition = `${(-x * k).toFixed(1)}px ${(-y * k).toFixed(1)}px`;
            el("div", "shotLab osdTxt", s, labels[key]);
            const hold = (shotsDef[i + 1] ? shotsDef[i + 1][0] : 8.25) - t;
            tl.fromTo(s, { scale: 1.35, rotation: (rnd() - 0.5) * 8 }, { scale: 1, rotation: 0, duration: hold, ease: "expo.out" }, t);
          }
          tl.set(s, { opacity: 1 }, t);
          if (prevShot) tl.set(prevShot, { opacity: 0 }, t);
          prevShot = s;
        });
        tl.set("#ttp", { opacity: 1 }, 6.4);
        tl.fromTo("#ttp", { scale: 1.2 }, { scale: 1, duration: 0.4, ease: "expo.out", immediateRender: false }, 6.4);
        for (let t = 6.4; t < 8.1; t += 0.1) tl.set("#redact", { opacity: rnd() < 0.3 ? 0.35 : 1, x: Math.round((rnd() - 0.5) * 14) }, T(t));
        tl.set("#ttp", { opacity: 0 }, 8.1);

        /* ===== 04 · Detective → suspect ===== */
        const from = "You're the detective.";
        const to = " You're the suspect. ";
        const pool = "#%&@$*?!/<>=+ABDEFGHKMNPRSTVWXZ0123456789";
        const SH = 130; // row pitch taller than the 90px window so neighbouring glyphs never peek in
        const slots = Array.from(from).map((c, i) => {
          const slot = el("div", "slot", $("#line"));
          const strip = el("div", "strip", slot);
          el("i", "", strip, " ");
          el("i", "", strip, c);
          for (let k = 0; k < 6; k++) el("i", "", strip, pool[Math.floor(rnd() * pool.length)]);
          const fin = el("i", "", strip, to[i]);
          if (i >= 12 && i <= 19) fin.classList.add("red");
          return strip;
        });
        slots.forEach((strip, i) => {
          tl.set(strip, { y: 0 }, 0);
          tl.set(strip, { y: -SH }, T(8.3 + i * 0.03));
          const resolve = 9.6 + i * 0.024;
          for (let t = 9.3 + (i % 3) * 0.01; t < resolve; t += STEP) tl.set(strip, { y: -SH * (2 + Math.floor(rnd() * 6)) }, T(t));
          tl.set(strip, { y: -SH * 8 }, T(resolve));
        });
        tl.fromTo("#line", { scale: 1 }, { scale: 1.07, duration: 2.6, ease: "power1.in" }, 8.3);
        for (let t = 10.85; t < 11.25; t += STEP) {
          const e = env(t, 0);
          tl.set("#line", { x: Math.round((rnd() - 0.5) * 220 * e), skewX: Math.round((rnd() - 0.5) * 50 * e), scaleY: 1 + (rnd() - 0.5) * 0.8 * e }, T(t));
        }
        tl.set("#lost", { opacity: 1 }, 11.25);

        /* ===== 05 · Title ===== */
        const words = [["#wWho", 11.5], ["#wKilled", 11.95], ["#wMary", 12.4]];
        words.forEach(([id, t]) => {
          tl.set(id, { opacity: 1 }, t);
          [[1.7, 0], [1.15, 0.035], [1.35, 0.07], [1.0, 0.105]].forEach(([s, o]) => tl.set(id, { scale: s }, T(t + o)));
        });
        tl.set("#qm", { opacity: 1 }, 12.85);
        tl.fromTo("#qm", { scale: 0.2, rotation: -40 }, { scale: 1, rotation: 8, duration: 0.55, ease: "back.out(1.6)", immediateRender: false }, 12.85);
        for (let t = 11.5; t < 14.1; t += STEP) {
          const e = env(t, 0.06), at = T(t);
          words.forEach(([id]) => {
            const dx = Math.round(((rnd() - 0.5) * 2 + 0.5) * 34 * e + 4);
            tl.set(id + " .r", { x: dx, y: Math.round((rnd() - 0.5) * 10 * e) }, at);
            tl.set(id + " .c", { x: -dx, y: Math.round((rnd() - 0.5) * 10 * e) }, at);
            tl.set(id + " .cond", { x: Math.round((rnd() - 0.5) * 70 * e), skewX: Math.round((rnd() - 0.5) * 30 * e) }, at);
          });
        }
        // Melt: a clone of the title is stretched down from a band, like a chewed tape.
        const melt = $("#titleWrap").cloneNode(true);
        melt.removeAttribute("id");
        melt.querySelectorAll("[id]").forEach((n) => n.removeAttribute("id"));
        melt.querySelectorAll(".cword").forEach((n) => (n.style.opacity = 1));
        $("#s5stage").appendChild(melt);
        tl.set(melt, { opacity: 0 }, 0);
        tl.set(melt, { opacity: 1, transformOrigin: "50% 760px", clipPath: "inset(760px 0px 0px 0px)" }, 14.1);
        tl.fromTo(melt, { scaleY: 1 }, { scaleY: 30, duration: 0.45, ease: "power2.in", immediateRender: false }, 14.1);
        tl.to("#titleWrap", { x: 30, duration: 0.45, ease: "steps(6)" }, 14.1);

        /* ===== 06 · Book + date ===== */
        const R6 = makeRig($("#rig6host"), 760, 1207, 160, 250);
        driveRig(R6, 14.6, 19.3, 0.035, 40);
        tl.fromTo("#endCam", { scale: 1.08 }, { scale: 1.0, duration: 4.7, ease: "power2.out" }, 14.6);
        tl.fromTo("#quest", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 14.8);
        tl.set("#quest", { opacity: 0 }, 17.2);
        tl.set("#solve", { opacity: 1 }, 17.2);
        tl.fromTo("#solve", { scale: 1.4 }, { scale: 1, duration: 0.3, ease: "expo.out", immediateRender: false }, 17.2);
        tl.to("#solve", { opacity: 0.2, duration: 0.3, ease: "steps(1)", yoyo: true, repeat: 3 }, 18.0);
        const a1 = Array.from("AVAILABLE IN").map((c) => el("span", "", $("#a1"), c));
        const a2 = Array.from("OCTOBER").map((c) => el("span", "", $("#a2"), c));
        a1.forEach((s, i) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, T(15.3 + i * 0.04)));
        a2.forEach((s, i) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, T(15.85 + i * 0.07)));
        [16.6, 18.4].forEach((t) => {
          for (let k = 0; k < 5; k++) tl.set("#avail", { x: Math.round((rnd() - 0.5) * 60), skewX: Math.round((rnd() - 0.5) * 24) }, T(t + k * STEP));
          tl.set("#avail", { x: 0, skewX: 0 }, T(t + 5 * STEP));
        });

        /* ===== CRT power-off ===== */
        tl.to("#tv", { scaleY: 0.004, filter: "brightness(3)", duration: 0.15, ease: "power3.in" }, 19.35);
        tl.to("#tv", { scaleX: 0, duration: 0.14, ease: "power3.in" }, 19.5);
        tl.fromTo("#crtDot", { opacity: 0, scale: 1 }, { opacity: 1, scale: 1, duration: 0.05, immediateRender: false }, 19.6);
        tl.to("#crtDot", { opacity: 0, scale: 0.2, duration: 0.3, ease: "power2.in" }, 19.66);

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
